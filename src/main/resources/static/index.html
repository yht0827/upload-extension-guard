<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파일 확장자 차단</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>파일 확장자 차단</h1>

        <section class="section">
            <h2>고정 확장자</h2>
            <div id="fixed-extensions" class="checkbox-group">
            </div>
        </section>

        <section class="section">
            <h2>커스텀 확장자</h2>
            <div class="input-group">
                <input type="text" id="custom-input" placeholder="확장자 입력" maxlength="20">
                <button id="add-btn" type="button">추가</button>
            </div>
            <p class="count">(<span id="custom-count">0</span>/200)</p>
            <div id="custom-extensions" class="tag-group">
            </div>
        </section>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
